<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#4f46e5" />
  <title>WorkMesh Mobile</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <!-- Top Header -->
    <header class="top-bar">
      <div class="brand-wrap">
        <div class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="6" cy="6" r="2.5"></circle>
            <circle cx="18" cy="6" r="2.5"></circle>
            <circle cx="12" cy="18" r="2.5"></circle>
            <path d="M8.2 7.2L15.8 7.2M7.3 8.1L10.7 15.8M16.7 8.1L13.3 15.8"></path>
          </svg>
        </div>
        <div class="brand-text">
          <div class="brand-title">WorkMesh</div>
          <div id="conn-status" class="brand-subtitle">...</div>
        </div>
      </div>
      <div class="top-actions">
        <button id="btn-lang" class="icon-btn" type="button" title="Language">AR/EN</button>
        <button id="btn-theme" class="icon-btn" type="button" title="Theme">☀</button>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="main-area">
      <!-- Unauthorized / Expired View -->
      <section id="auth-error-view" class="center-card hidden">
        <div class="lock-hero">🔒</div>
        <h2 id="auth-err-title">Session Expired</h2>
        <p id="auth-err-desc" class="muted"></p>
        <div class="token-paste-row">
          <input id="manual-token-input" type="text" class="input" placeholder="Token..." />
          <button id="btn-apply-token" class="btn btn-primary" type="button">Connect</button>
        </div>
      </section>

      <!-- Chats Tab -->
      <section id="tab-chats" class="tab-view">
        <!-- Conversation List -->
        <div id="conv-list-pane" class="pane">
          <div class="pane-toolbar">
            <input id="conv-search" type="search" class="input" placeholder="Search chats..." />
            <button id="btn-new-group" class="btn btn-primary btn-sm" type="button">+</button>
          </div>
          <div id="quick-peers-strip" class="peers-strip hidden"></div>
          <div id="conv-list" class="list-stack"></div>
        </div>

        <!-- Active Thread Pane -->
        <div id="thread-pane" class="pane hidden">
          <div class="thread-header">
            <button id="btn-back-chats" class="icon-btn" type="button">←</button>
            <div id="thread-avatar" class="avatar sm"></div>
            <div class="thread-meta">
              <div id="thread-title" class="thread-title"></div>
              <div id="thread-subtitle" class="thread-subtitle"></div>
            </div>
            <button id="btn-thread-search" class="icon-btn" type="button">🔍</button>
          </div>
          <div id="thread-search-bar" class="search-inline hidden">
            <input id="msg-search-input" type="search" class="input" placeholder="Search messages..." />
          </div>
          <div id="messages-list" class="messages-scroll"></div>
          <div id="reply-banner" class="reply-banner hidden">
            <div class="reply-banner-body">
              <div id="reply-banner-author" class="reply-author"></div>
              <div id="reply-banner-snippet" class="reply-snippet"></div>
            </div>
            <button id="btn-cancel-reply" class="icon-btn sm" type="button">✕</button>
          </div>
          <div id="recording-bar" class="recording-bar hidden">
            <button id="btn-rec-cancel" class="btn btn-ghost btn-sm" type="button">✕</button>
            <div class="rec-indicator">
              <span class="rec-dot"></span>
              <span id="rec-timer">00:00</span>
            </div>
            <button id="btn-rec-send" class="btn btn-primary btn-sm" type="button">Send</button>
          </div>
          <form id="composer-form" class="composer-bar">
            <input id="chat-file-input" type="file" class="hidden" />
            <button id="btn-attach-file" class="icon-btn" type="button" title="Attach">📎</button>
            <input id="composer-input" type="text" class="input composer-input" autocomplete="off" placeholder="Message..." />
            <button id="btn-voice-rec" class="icon-btn" type="button" title="Voice Note">🎤</button>
            <button id="btn-send-msg" class="btn btn-primary send-btn" type="submit">➤</button>
          </form>
        </div>
      </section>

      <!-- Files (Vault) Tab -->
      <section id="tab-files" class="tab-view hidden">
        <div class="pane-toolbar">
          <input id="vault-search-input" type="search" class="input" placeholder="Search Vault..." />
          <input id="vault-upload-input" type="file" class="hidden" />
          <button id="btn-vault-upload" class="btn btn-primary btn-sm" type="button">⬆</button>
        </div>
        <div id="vault-breadcrumbs" class="breadcrumbs"></div>
        <div id="vault-list" class="list-stack"></div>
      </section>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
      <button id="nav-chats" class="nav-item active" type="button">
        <span class="nav-icon">💬</span>
        <span id="nav-chats-label" class="nav-label">Chats</span>
        <span id="nav-unread-badge" class="badge hidden">0</span>
      </button>
      <button id="nav-files" class="nav-item" type="button">
        <span class="nav-icon">📁</span>
        <span id="nav-files-label" class="nav-label">Files</span>
      </button>
    </nav>

    <!-- Generic Modal Backdrop -->
    <div id="modal-backdrop" class="modal-backdrop hidden">
      <div class="modal-card">
        <div class="modal-header">
          <h3 id="modal-title" class="modal-title"></h3>
          <button id="modal-close" class="icon-btn sm" type="button">✕</button>
        </div>
        <div id="modal-body" class="modal-body"></div>
      </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
